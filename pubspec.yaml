name: ipo_tracker
description: "A personal IPO management and tracking application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  url_launcher: ^6.3.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^10.3.1
  http: ^1.2.2
  share_plus: ^13.3.0
  file_picker: ^13.1.0
  pdf: ^3.11.3
  printing: ^5.13.4
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
